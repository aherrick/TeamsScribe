name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained folder publish; native DLLs (Foundry Local, onnxruntime,
      # whisper) stay loose and Velopack packages the whole folder.
      - run: dotnet publish TeamsScribe.csproj -c Release -r win-x64 --self-contained -p:Version=${{ env.VERSION }} -o publish

      # CPU whisper runtime drops win-arm64/win-x86 natives unused by the win-x64 build.
      - run: Remove-Item publish/runtimes/win-arm64, publish/runtimes/win-x86 -Recurse -Force -ErrorAction SilentlyContinue

      - run: dotnet tool install -g vpk

      # Pull the previous release so Velopack can build a delta package.
      - run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - run: vpk pack -u TeamsScribe -v ${{ env.VERSION }} -p publish -e TeamsScribe.exe

      - run: vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "TeamsScribe ${{ env.VERSION }}" --tag v${{ env.VERSION }} --token ${{ secrets.GITHUB_TOKEN }}
