name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish TeamsScribe.csproj -c Release -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=${{ env.VERSION }} -o publish

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: publish/TeamsScribe.exe
