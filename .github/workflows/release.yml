name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish TeamsScribe.csproj -c Release -p:Version=${{ env.VERSION }} -o publish

      # Foundry Local / ONNX ship native DLLs beside the exe, so release the whole folder.
      - run: Compress-Archive -Path publish/* -DestinationPath TeamsScribe-v${{ env.VERSION }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: TeamsScribe-v${{ env.VERSION }}.zip
