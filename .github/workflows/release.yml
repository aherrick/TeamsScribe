name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Single-file folds managed assemblies into the exe; native DLLs (Foundry Local,
      # onnxruntime, whisper) stay loose in runtimes/, so release the whole folder.
      - run: dotnet publish TeamsScribe.csproj -c Release -p:Version=${{ env.VERSION }} -p:PublishSingleFile=true -p:SelfContained=true -p:IncludeNativeLibrariesForSelfExtract=false -p:DebugType=none -p:DebugSymbols=false -o publish

      # CPU whisper runtime drops win-arm64/win-x86 natives unused by the win-x64 build.
      - run: Remove-Item publish/runtimes/win-arm64, publish/runtimes/win-x86 -Recurse -Force -ErrorAction SilentlyContinue

      - run: Compress-Archive -Path publish/* -DestinationPath TeamsScribe-v${{ env.VERSION }}.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: TeamsScribe-v${{ env.VERSION }}.zip
